  search_engine_es7:
    build:
      context: .
      dockerfile: services/search-engines/Dockerfile
      target: m2d_search_engine
      args:
        - M2D_ENABLE_SEARCH_ENGINE=${M2D_ENABLE_ES7:-yes}
        - M2D_SEARCH_ENGINE_VENDOR=elasticsearch
        - M2D_SEARCH_ENGINE_VERSION=${M2D_ES7_VERSION:-7}
    container_name: "m2d-searchengine-es7${M2D_PROJECT_SUFFIX:-}"
    restart: unless-stopped
    environment:
      - "ES_JAVA_OPTS=-Xms128m -Xmx1g"
    volumes:
      - "m2d-es7-data:/usr/share/elasticsearch/data"
    ports:
      - "${M2D_PORT_FOR_ES7:-9207}:9200"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  search_engine_es8:
    build:
      context: .
      dockerfile: services/search-engines/Dockerfile
      target: m2d_search_engine
      args:
        - M2D_ENABLE_SEARCH_ENGINE=${M2D_ENABLE_ES8:-yes}
        - M2D_SEARCH_ENGINE_VENDOR=elasticsearch
        - M2D_SEARCH_ENGINE_VERSION=${M2D_ES8_VERSION:-8}
    container_name: "m2d-searchengine-es8${M2D_PROJECT_SUFFIX:-}"
    restart: unless-stopped
    environment:
      - "ES_JAVA_OPTS=-Xms128m -Xmx1g"
    volumes:
      - "m2d-es8-data:/usr/share/elasticsearch/data"
    ports:
      - "${M2D_PORT_FOR_ES8:-9208}:9200"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  search_engine_opensearch:
    build:
      context: .
      dockerfile: services/search-engines/Dockerfile
      target: m2d_search_engine
      args:
        - M2D_ENABLE_SEARCH_ENGINE=${M2D_ENABLE_OPENSEARCH:-yes}
        - M2D_SEARCH_ENGINE_VENDOR=opensearch
        - M2D_SEARCH_ENGINE_VERSION=${M2D_OPENSEARCH_VERSION:-2}
    container_name: "m2d-searchengine-opensearch${M2D_PROJECT_SUFFIX:-}"
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms128m -Xmx1g"
    volumes:
      - "m2d-opensearch-data:/usr/share/opensearch/data"
    ports:
      - "${M2D_PORT_FOR_OPENSEARCH:-9200}:9200"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  message_broker:
    build:
      context: .
      dockerfile: services/message-brokers/Dockerfile
      target: m2d_message_broker
      args:
        - M2D_ENABLE_MESSAGE_BROKER=${M2D_ENABLE_MESSAGE_BROKER:-no}
        - M2D_MESSAGE_BROKER_VENDOR=${M2D_MESSAGE_BROKER_VENDOR:-rabbitmq}
        - M2D_MESSAGE_BROKER_VERSION=${M2D_MESSAGE_BROKER_VERSION:-3.8}
    container_name: "m2d-messagebroker${M2D_PROJECT_SUFFIX:-}"
    restart: unless-stopped
    environment:
      # Used by ActiveMQ Artemis; ignored by RabbitMQ (which keeps guest/guest).
      - ARTEMIS_USER=${M2D_MESSAGE_BROKER_USER:-admin}
      - ARTEMIS_PASSWORD=${M2D_MESSAGE_BROKER_PASSWORD:-admin}
    ports:
      # Host==container so one var drives both sides: RabbitMQ 15672/5672,
      # ActiveMQ (Artemis) 8161 (console) / 61616 (core acceptor, speaks STOMP).
      - "${M2D_PORT_FOR_MESSAGE_BROKER:-15672}:${M2D_PORT_FOR_MESSAGE_BROKER:-15672}"
      - "${M2D_PORT_FOR_MESSAGE_BROKER_AMQP:-5672}:${M2D_PORT_FOR_MESSAGE_BROKER_AMQP:-5672}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web_cache:
    build:
      context: .
      dockerfile: services/web-cache/Dockerfile
      target: m2d_web_cache
      args:
        - M2D_ENABLE_WEB_CACHE=${M2D_ENABLE_WEB_CACHE:-no}
        - M2D_WEB_CACHE_VENDOR=${M2D_WEB_CACHE_VENDOR:-varnish}
        - M2D_WEB_CACHE_VERSION=${M2D_WEB_CACHE_VERSION:-6}
    container_name: "m2d-webcache${M2D_PROJECT_SUFFIX:-}"
    volumes:
      - "./services/web-cache/default.vcl:/etc/varnish/default.vcl"
    tmpfs:
      - /var/lib/varnish:exec
    depends_on:
      - "web"
    environment:
      - VARNISH_SIZE=2G
    restart: unless-stopped
    ports:
      - "${M2D_PORT_FOR_WEB_CACHE:-8080}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db_cache:
    build:
      context: .
      dockerfile: services/db-cache/Dockerfile
      target: m2d_db_cache
      args:
        - M2D_ENABLE_DB_CACHE=${M2D_ENABLE_DB_CACHE:-no}
        - M2D_DB_CACHE_VENDOR=${M2D_DB_CACHE_VENDOR:-redis}
        - M2D_DB_CACHE_VERSION=${M2D_DB_CACHE_VERSION:-6.0}
    container_name: "m2d-dbcache${M2D_PROJECT_SUFFIX:-}"
    restart: unless-stopped
    ports:
      - "${M2D_PORT_FOR_DB_CACHE:-6379}:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mailcatcher:
    build:
      context: .
      dockerfile: tools/mailcatcher/Dockerfile
      target: m2d_mailcatcher
      args:
        - M2D_ENABLE_MAILCATCHER=${M2D_ENABLE_MAILCATCHER:-no}
    container_name: "m2d-mailcatcher${M2D_PROJECT_SUFFIX:-}"
    restart: unless-stopped
    ports:
      - "${M2D_PORT_FOR_MAILCATCHER:-1080}:1080"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  blackfire:
    build:
      context: .
      dockerfile: tools/blackfire/Dockerfile
      target: m2d_blackfire
      args:
        - M2D_ENABLE_BLACKFIRE=${M2D_ENABLE_BLACKFIRE:-no}
    container_name: "m2d-blackfire${M2D_PROJECT_SUFFIX:-}"
    environment:
        - BLACKFIRE_SERVER_ID
        - BLACKFIRE_SERVER_TOKEN
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  selenium:
    build:
      context: .
      dockerfile: tools/selenium/Dockerfile
      target: m2d_selenium
      args:
        - M2D_CPU_TYPE=${M2D_CPU_TYPE:-m1}
        - M2D_ENABLE_SELENIUM=${M2D_ENABLE_SELENIUM:-no}
        - M2D_SELENIUM_VERSION=${M2D_SELENIUM_VERSION:-'3.14.0'}
    container_name: "m2d-selenium${M2D_PROJECT_SUFFIX:-}"
    volumes:
      - /dev/shm:/dev/shm
    ports:
     - "${M2D_PORT_FOR_SELENIUM_HUB:-4444}:4444"
     - "${M2D_PORT_FOR_SELENIUM_VNC:-5900}:5900"
    shm_size: '2gb'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: "m2d-network${M2D_PROJECT_SUFFIX:-}"

volumes:
  src-volume:
  apache-home-volume:
  apache-root-volume:
  apache-src-composer-cache-volume:
  multi-home-volume:
  multi-root-volume:
  multi-src-composer-cache-volume:
  db-volume:
  db-slave-volume:
  m2d-es7-data:
  m2d-es8-data:
  m2d-opensearch-data:
