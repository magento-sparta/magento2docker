# ── PWA Studio port map ───────────────────────────────────────────────────────
# File managed by pwa-install / pwa-start; one line per project: "name port"
RewriteMap pwa_ports txt:/usr/local/etc/pwa-ports.map

UseCanonicalName Off

# ── {project}.{phpversion}.127.0.0.1.nip.io ──────────────────────────────────
# e.g. 24dev.php81.127.0.0.1.nip.io/pub/swagger
#      %1 = 24dev   %2 = php81

<VirtualHost *:80>
    ServerAlias *.*.127.0.0.1.nip.io
    RequestHeader set X-Forwarded-Proto "https"
    ServerAdmin webmaster@localhost
    VirtualDocumentRoot ${M2D_APACHE_ROOT_DIRECTORY}/%1

    DirectoryIndex index.php index.html

    SetEnvIf X-Forwarded-Proto https HTTPS=on

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^[^.]+\.([^.]+)\. [NC]
    RewriteRule ^ - [E=PHP_VER:%1]

    # ── PWA Studio: pwa-{project}.{phpver}.127.0.0.1.nip.io → Node dev server ──
    RewriteCond %{HTTP_HOST} ^pwa-([^.]+)\. [NC]
    RewriteRule ^ - [E=PWA_PROJECT:%1]
    # WebSocket upgrade (HMR)
    RewriteCond %{ENV:PWA_PROJECT} !^$
    RewriteCond ${pwa_ports:%{ENV:PWA_PROJECT}|NONE} !^NONE$
    RewriteCond %{HTTP:Upgrade} ^websocket$ [NC]
    RewriteRule ^(.*)$ ws://127.0.0.1:${pwa_ports:%{ENV:PWA_PROJECT}}/$1 [P,L]
    # Regular HTTP proxy
    RewriteCond %{ENV:PWA_PROJECT} !^$
    RewriteCond ${pwa_ports:%{ENV:PWA_PROJECT}|NONE} !^NONE$
    RewriteRule ^(.*)$ http://127.0.0.1:${pwa_ports:%{ENV:PWA_PROJECT}}/$1 [P,L]

    <Directory ${M2D_APACHE_ROOT_DIRECTORY}>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{REQUEST_FILENAME}"
    ProxyFCGISetEnvIf "true" CONFIG__DEFAULT__WEB__SECURE__BASE_URL   "https://%{HTTP_HOST}/"
    ProxyFCGISetEnvIf "true" CONFIG__DEFAULT__WEB__UNSECURE__BASE_URL "https://%{HTTP_HOST}/"
    <FilesMatch "\.php$">
        <If "reqenv('PHP_VER') == 'php81'">
            SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
        </If>
        <ElseIf "reqenv('PHP_VER') == 'php82'">
            SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
        </ElseIf>
        <ElseIf "reqenv('PHP_VER') == 'php83'">
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </ElseIf>
        <ElseIf "reqenv('PHP_VER') == 'php84'">
            SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
        </ElseIf>
        <ElseIf "reqenv('PHP_VER') == 'php85'">
            SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
        </ElseIf>
        <Else>
            SetHandler "proxy:unix:/run/php/php${M2D_DEFAULT_PHP_VERSION}-fpm.sock|fcgi://localhost"
        </Else>
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

