UseCanonicalName Off
<VirtualHost *:80>
    RequestHeader set X-Forwarded-Proto "https"
	ServerAdmin webmaster@localhost
    ServerAlias *.*.127.0.0.1.nip.io
    # Sparta-style nested "<project>/<environment>" folders take precedence
    # over the flat decorative multi-website simulation below (README
    # "Domains" section) when a real two-level directory exists on disk.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^.]+)\.([^.]+)\.127\.0\.0\.1\.nip\.io(:[0-9]+)?$ [NC]
    RewriteCond /var/www/html/%1/%2 -d
    RewriteRule ^(.*)$ /var/www/html/%1/%2$1 [L]
    VirtualDocumentRoot /var/www/html/%2
        <Directory //>
            Options -Indexes +FollowSymLinks +MultiViews
            AllowOverride All
            Require all granted
        </Directory>
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
